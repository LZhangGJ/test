name: One-shot fetch Kaggle discussion 733932

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fetch-kaggle-733932-main.yml

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Install public clients
        shell: bash
        run: |
          python -m pip install --upgrade kaggle selenium beautifulsoup4
          kaggle --version || true
          google-chrome --version || chromium --version || true

      - name: Read through the official Kaggle CLI
        shell: bash
        run: |
          set +e
          kaggle forums topics show 733932 > KAGGLE_DISCUSSION_733932_CLI.txt 2>&1
          echo "$?" > KAGGLE_DISCUSSION_733932_CLI.status
          kaggle competitions topics show rsna-knee-abnormality-detection 733932 > KAGGLE_DISCUSSION_733932_COMPETITION_CLI.txt 2>&1
          echo "$?" > KAGGLE_DISCUSSION_733932_COMPETITION_CLI.status
          wc -c KAGGLE_DISCUSSION_733932_* || true

      - name: Read with a real headless browser
        shell: bash
        run: |
          set +e
          python - <<'PY'
          from __future__ import annotations
          import json
          import time
          from pathlib import Path

          from bs4 import BeautifulSoup
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.common.by import By

          page_url = 'https://www.kaggle.com/competitions/rsna-knee-abnormality-detection/discussion/733932'
          api_url = '/api/i/discussions.DiscussionsService/GetForumTopicById?forumTopicId=733932&includeComments=true'
          options = Options()
          options.add_argument('--headless=new')
          options.add_argument('--no-sandbox')
          options.add_argument('--disable-dev-shm-usage')
          options.add_argument('--disable-gpu')
          options.add_argument('--window-size=1600,1200')
          options.add_argument('--lang=en-US')
          options.add_argument('--user-agent=Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/131 Safari/537.36')

          output = {'page_url': page_url}
          driver = None
          try:
              driver = webdriver.Chrome(options=options)
              driver.set_page_load_timeout(90)
              driver.get(page_url)
              time.sleep(20)
              output['title'] = driver.title
              output['current_url'] = driver.current_url
              output['cookies'] = [c.get('name') for c in driver.get_cookies()]
              html = driver.page_source
              Path('KAGGLE_DISCUSSION_733932_BROWSER.html').write_text(html, encoding='utf-8')
              try:
                  body_text = driver.find_element(By.TAG_NAME, 'body').text
              except Exception:
                  body_text = BeautifulSoup(html, 'html.parser').get_text('\n')
              Path('KAGGLE_DISCUSSION_733932_BROWSER.txt').write_text(body_text, encoding='utf-8')

              script = r'''
              const done = arguments[0];
              fetch('/api/i/discussions.DiscussionsService/GetForumTopicById?forumTopicId=733932&includeComments=true', {
                method: 'GET',
                credentials: 'include',
                headers: {'Accept': 'application/json, text/plain, */*'}
              }).then(async r => done({status:r.status, contentType:r.headers.get('content-type'), text:await r.text()}))
                .catch(e => done({error:String(e)}));
              '''
              driver.set_script_timeout(90)
              output['browser_fetch'] = driver.execute_async_script(script)
          except Exception as error:
              output['browser_error'] = repr(error)
          finally:
              if driver is not None:
                  driver.quit()

          fetch_text = output.get('browser_fetch', {}).get('text')
          if fetch_text:
              try:
                  output['browser_fetch_json'] = json.loads(fetch_text)
              except Exception:
                  output['browser_fetch_json'] = None
          Path('KAGGLE_DISCUSSION_733932_BROWSER_RESULT.json').write_text(
              json.dumps(output, ensure_ascii=False, indent=2), encoding='utf-8'
          )
          print(json.dumps({k:v for k,v in output.items() if k not in {'browser_fetch','browser_fetch_json'}}, ensure_ascii=False, indent=2))
          print('fetch status:', output.get('browser_fetch', {}).get('status'))
          print('fetch content type:', output.get('browser_fetch', {}).get('contentType'))
          print('fetch bytes:', len(fetch_text or ''))
          PY
          echo "$?" > KAGGLE_DISCUSSION_733932_BROWSER.status
          wc -c KAGGLE_DISCUSSION_733932_BROWSER* || true

      - name: Commit result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add KAGGLE_DISCUSSION_733932_*
          if git diff --cached --quiet; then
            echo 'No changed output'
          else
            git commit -m 'Refresh temporary Kaggle discussion 733932 payload [skip ci]'
            git push origin HEAD:main
          fi
