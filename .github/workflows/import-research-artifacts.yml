name: Import complete research artifacts

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/import-research-artifacts.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download and verify transfer archive
        shell: bash
        run: |
          set -euo pipefail
          url="https://lzresearchphase3aug2026.serveo.net/all_research_artifacts.tar.gz"
          for attempt in $(seq 1 60); do
            if curl --fail --location --silent --show-error --connect-timeout 10 --max-time 60 \
              "$url" -o /tmp/all_research_artifacts.tar.gz; then
              if echo "d6b2b78490ff0749e84d9532cf8a0d12ed2af9a33bf675832d1261e745662cc5  /tmp/all_research_artifacts.tar.gz" | sha256sum -c -; then
                break
              fi
            fi
            rm -f /tmp/all_research_artifacts.tar.gz
            if [ "$attempt" -eq 60 ]; then
              echo "Unable to retrieve a valid transfer archive." >&2
              exit 1
            fi
            sleep 5
          done

      - name: Extract and verify every deliverable
        shell: bash
        run: |
          set -euo pipefail
          tar -xzf /tmp/all_research_artifacts.tar.gz -C "$GITHUB_WORKSPACE"
          cat > /tmp/expected.sha256 <<'EOF'
          447d8517ea757f72f29c7de9a8e20e266b894eb22954337fe0687e60d0fc09ab  Target-aware_MoE_Few-shot_两轮调研综合总结.docx
          e8755e323e88dead8af14ccf8ea1d0d3d8fdf2d85f05a041e3c51e1062f1c7c8  phase3_candidate_hypotheses.csv
          c8f97e98e29424728f75b8576e3ea0aa7ee31493a3b2150d15dcf94d9eb51100  phase3_candidate_scorecard.csv
          c9958499e324541334ac6d3f9a901cfa29d6232fb4edc305badd9bff30ca0b65  phase3_experiment_matrix.csv
          39decb94ef8f6a538e3b6836cee8c466d70750f33c32126ef58ab7324e22f90d  phase3_literature_dedup_matrix.csv
          2da25c9ab88b50a03bde41a270a73038c9ad21f658c5f432712d86f07d44356d  phase3_research_bundle.zip
          c6855a7668baa934725dfa5b9696aa86222bca304651b7967b271951fe44e4db  phase3_research_plan.json
          a54470718f7fbde19838d1bdb12456da0139b37aa3b727e18464c4ff89e11349  phase3_research_report.md
          EOF
          sha256sum -c /tmp/expected.sha256
          cp /tmp/expected.sha256 SHA256SUMS.txt
          rm -rf encoded
          rm -f direct-push-check.txt probe.txt probe-path.txt probe-file-param.txt

      - name: Commit imported artifacts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Repository already contains the verified artifacts."
            exit 0
          fi
          git commit -m "Add complete Phase 3 research artifacts"
          git push origin HEAD:main
