name: Ephemeral authenticated Kaggle fetch 735304 and 735826

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fetch-kaggle-auth-735304-735826.yml

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Generate ephemeral public key
        shell: bash
        run: |
          set -euo pipefail
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out /tmp/kaggle_bridge_private.pem
          openssl pkey -in /tmp/kaggle_bridge_private.pem -pubout -out KAGGLE_BRIDGE_PUBLIC_735304_735826.pem
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add KAGGLE_BRIDGE_PUBLIC_735304_735826.pem
          git commit -m 'Publish ephemeral Kaggle bridge public key for 735304 and 735826 [skip ci]'
          git push origin HEAD:main

      - name: Await encrypted token
        shell: bash
        run: |
          set -euo pipefail
          found=0
          for i in $(seq 1 90); do
            git pull --rebase origin main >/dev/null 2>&1 || true
            if [[ -s KAGGLE_BRIDGE_TOKEN_735304_735826.b64 ]]; then
              found=1
              break
            fi
            sleep 5
          done
          if [[ "$found" != 1 ]]; then
            echo 'Encrypted token was not supplied within the bounded bridge window.'
            exit 1
          fi

      - name: Decrypt in memory and read topics with official CLI
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade kaggle >/dev/null
          base64 --decode KAGGLE_BRIDGE_TOKEN_735304_735826.b64 > /tmp/kaggle_bridge_token.enc
          openssl pkeyutl -decrypt \
            -inkey /tmp/kaggle_bridge_private.pem \
            -in /tmp/kaggle_bridge_token.enc \
            -out /tmp/kaggle_bridge_token.txt \
            -pkeyopt rsa_padding_mode:oaep \
            -pkeyopt rsa_oaep_md:sha256 \
            -pkeyopt rsa_mgf1_md:sha256
          chmod 600 /tmp/kaggle_bridge_token.txt
          export KAGGLE_API_TOKEN="$(cat /tmp/kaggle_bridge_token.txt)"
          for topic in 735304 735826; do
            set +e
            kaggle forums topics show "$topic" --page-size 1000 > "KAGGLE_DISCUSSION_${topic}_AUTH.txt" 2>&1
            status=$?
            set -e
            printf '%s\n' "$status" > "KAGGLE_DISCUSSION_${topic}_AUTH.status"
          done
          kaggle --version > KAGGLE_DISCUSSION_735304_735826_AUTH.version 2>&1 || true
          unset KAGGLE_API_TOKEN
          shred -u /tmp/kaggle_bridge_token.txt /tmp/kaggle_bridge_token.enc /tmp/kaggle_bridge_private.pem || true

      - name: Commit results and remove bridge material
        shell: bash
        run: |
          set -euo pipefail
          rm -f KAGGLE_BRIDGE_PUBLIC_735304_735826.pem KAGGLE_BRIDGE_TOKEN_735304_735826.b64
          git add -A \
            KAGGLE_DISCUSSION_735304_AUTH.* \
            KAGGLE_DISCUSSION_735826_AUTH.* \
            KAGGLE_DISCUSSION_735304_735826_AUTH.version \
            KAGGLE_BRIDGE_PUBLIC_735304_735826.pem \
            KAGGLE_BRIDGE_TOKEN_735304_735826.b64
          git commit -m 'Store authenticated Kaggle discussions 735304 and 735826 [skip ci]'
          git push origin HEAD:main
