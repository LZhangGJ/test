name: Materialize research bundle

on:
  push:
    branches: [main]
    paths:
      - research_bundle/manifest.json

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify and extract research bundle
        shell: bash
        run: |
          python - <<'PY'
          import base64
          import hashlib
          import json
          import tarfile
          from pathlib import Path

          root = Path.cwd().resolve()
          bundle_dir = root / "research_bundle"
          manifest = json.loads((bundle_dir / "manifest.json").read_text(encoding="utf-8"))

          chunks = []
          for item in manifest["parts"]:
              path = bundle_dir / item["name"]
              data = path.read_bytes()
              digest = hashlib.sha256(data).hexdigest()
              if digest != item["sha256"]:
                  raise RuntimeError(f"Checksum mismatch for {path}: {digest}")
              chunks.append(data)

          encoded = b"".join(chunks)
          encoded_digest = hashlib.sha256(encoded).hexdigest()
          if encoded_digest != manifest["base64_sha256"]:
              raise RuntimeError(f"Base64 checksum mismatch: {encoded_digest}")

          archive_bytes = base64.b64decode(encoded, validate=False)
          archive_digest = hashlib.sha256(archive_bytes).hexdigest()
          if archive_digest != manifest["archive_sha256"]:
              raise RuntimeError(f"Archive checksum mismatch: {archive_digest}")

          archive_path = Path("/tmp/tamoe_research_bundle.tar.gz")
          archive_path.write_bytes(archive_bytes)

          with tarfile.open(archive_path, "r:gz") as tf:
              for member in tf.getmembers():
                  target = (root / member.name).resolve()
                  if target != root and root not in target.parents:
                      raise RuntimeError(f"Unsafe archive path: {member.name}")
              tf.extractall(root)

          print(f"Extracted {len(list(root.rglob('*')))} paths")
          PY

      - name: Commit materialized files
        shell: bash
        run: |
          rm -rf research_bundle
          rm -f .github/workflows/materialize-research-bundle.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "add target-aware MoE research and experiment plan"
          git push origin HEAD:main
